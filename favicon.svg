<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd" />
      <stop offset="35%" stop-color="#e0b84c" />
      <stop offset="70%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#916c14" />
    </linearGradient>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12483c" />
      <stop offset="50%" stop-color="#0a2a22" />
      <stop offset="100%" stop-color="#051713" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#c59b27" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="32" cy="32" r="30" fill="url(#emeraldBg)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Subtle Inner Ring -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 1.5" opacity="0.65"/>

  <!-- Crescent & Star Motif (Top Center) -->
  <g filter="url(#goldGlow)">
    <path d="M 33 11 A 5.5 5.5 0 1 0 35 21 A 4.5 4.5 0 1 1 33 11 Z" fill="url(#goldGrad)" />
    <!-- Small 5-Pointed Star inside crescent -->
    <polygon points="36.5,15 37.4,16.8 39.4,16.8 37.8,18 38.4,19.9 36.5,18.8 34.6,19.9 35.2,18 33.6,16.8 35.6,16.8" fill="url(#goldGrad)" />
  </g>

  <!-- Central Kaaba Motif (Architectural Emblem) -->
  <g filter="url(#goldGlow)" transform="translate(0, 4)">
    <!-- Base Cube -->
    <rect x="20" y="24" width="24" height="23" rx="2" fill="#04120e" stroke="url(#goldGrad)" stroke-width="1.8"/>
    
    <!-- Kiswah Gold Belt (Hizam) -->
    <rect x="20" y="28.5" width="24" height="4.5" fill="url(#goldGrad)"/>
    <line x1="20" y1="30.75" x2="44" y2="30.75" stroke="#04120e" stroke-width="0.6" stroke-dasharray="1 1"/>

    <!-- Kaaba Golden Door (Bab ar-Rahmah) -->
    <rect x="24" y="34.5" width="6.5" height="12.5" rx="1" fill="url(#goldGrad)"/>
    <!-- Door details -->
    <rect x="25.2" y="36" width="4.1" height="9.5" fill="none" stroke="#04120e" stroke-width="0.6"/>

    <!-- Mizab ar-Rahmah (Golden Spout) -->
    <rect x="30" y="23" width="3" height="2" fill="url(#goldGrad)"/>

    <!-- Chadharwan (Base Rim) -->
    <line x1="18.5" y1="47" x2="45.5" y2="47" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
